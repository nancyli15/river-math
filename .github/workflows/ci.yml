name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Compiler version
        run: $CC --version
      - name: Build (release)
        run: make
      - name: Test (debug + sanitizers)
        run: make test
      - name: Test every 7-card hand (release)
        run: make test-full
      - name: CLI smoke test
        run: ./build/release/rivermath eval AhKhQhJhTh2c3d
